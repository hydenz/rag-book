services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ragbook-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragbook
    ports:
      - "5432:5432"
    volumes:
      - ragbook_pgdata:/var/lib/postgresql/data

volumes:
  ragbook_pgdata: