services:
  - type: web
    name: rag-book
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-book-db
          property: connectionString
      # Set in the Render dashboard (Secret), not here:
      - key: OpenAI__ApiKey
        sync: false

databases:
  - name: rag-book-db
    plan: free
    postgresMajorVersion: "16"
